[package]
name = "broccoli-cli-core"
version = "0.1.0"
description = "Shared CLI utilities for Broccoli (auth, config, API client)"
license = "MIT"
repository = "https://github.com/THUSAAC-PSD/broccoli"
edition = "2024"
rust-version = "1.89"

[dependencies]
broccoli-api-types = { path = "../api-types" }
anyhow.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
# rustls avoids an OpenSSL dependency. By default the CLI trusts the OS store
# (rustls-native-certs) plus the bundled Mozilla roots (webpki-root-certs);
# platform-verifier backs BROCCOLI_TLS=system.
ureq = { version = "3", features = ["json", "platform-verifier"] }
rustls-native-certs = "0.8"
webpki-root-certs = "1"
dirs.workspace = true
console = "0.15"
rand.workspace = true
http = "1"
ratatui.workspace = true
crossterm.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
