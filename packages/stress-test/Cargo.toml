[package]
name = "stress-test"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "broccoli-stress-test"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
ratatui = { workspace = true }
crossterm = { workspace = true }
hdrhistogram = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }
rand = { workspace = true }
uuid = { workspace = true }
futures = { workspace = true }

# fault::* dependencies.
async-trait = { workspace = true }
broccoli-api-types.workspace = true
common = { workspace = true, features = ["test-util"] }
redis = { workspace = true }
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-aws-lc-rs", "macros", "chrono", "uuid"] }
testcontainers.workspace = true
testcontainers-modules = { workspace = true, features = ["redis"] }

[dev-dependencies]
wiremock = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
