[package]
name = "worker"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
broccoli-types.workspace = true
chrono.workspace = true
common = { workspace = true, features = ["sea-orm", "object-storage"] }
config.workspace = true
futures.workspace = true
hex.workspace = true
mq.workspace = true
sea-orm = { workspace = true, features = [
  "runtime-tokio-rustls",
  "sqlx-postgres",
] }
serde.workspace = true
sha2.workspace = true
serde_json.workspace = true
time.workspace = true
thiserror.workspace = true
tokio.workspace = true
axum.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-opentelemetry.workspace = true
tracing-subscriber.workspace = true
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
opentelemetry-prometheus.workspace = true
prometheus.workspace = true
uuid.workspace = true
lru = "0.16.3"
redis = { workspace = true }
hostname = "0.4"
local-ip-address = "0.6"
libc = "0.2"

[features]
# Test doubles (no-op and unavailable file cachers, executors built around a
# given sandbox manager) for this crate's and the server's tests.
test-support = []

[dev-dependencies]
common = { workspace = true, features = ["testing", "test-util"] }
tokio = { workspace = true, features = ["test-util"] }
worker = { path = ".", features = ["test-support"] }
hdrhistogram = { workspace = true }
serial_test = "3"
tempfile = "3"
testcontainers.workspace = true
testcontainers-modules = { workspace = true, features = ["postgres", "redis"] }
