# Wall time compared with another node's wall time comes from the platform
# clock (`common::clock::PlatformClock`, or SQL `now()`); durations come from
# `Instant`. Reading this host's own wall clock lets nodes disagree.
#
# Clippy reads this file per crate: packages/server, packages/common and
# packages/worker carry the same one, which a server test pins equal. The one
# exception is the clock itself (common/src/clock.rs), which reads the local
# clock to report this host's offset.
disallowed-methods = [
  { path = "chrono::Utc::now", reason = "use the platform clock (`common::clock::PlatformClock`) or SQL `now()`" },
  { path = "chrono::Local::now", reason = "use the platform clock (`common::clock::PlatformClock`) or SQL `now()`" },
  { path = "std::time::SystemTime::now", reason = "use the platform clock for wall time or `Instant` for durations" },
]
