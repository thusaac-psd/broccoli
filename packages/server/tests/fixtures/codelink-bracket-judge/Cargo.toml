# Root plugin crate: outside the main Cargo workspace, exactly like the real
# plugins under `plugins/*`. An explicit empty `[workspace]` pins it as its
# own workspace root so cargo resolves it standalone even when the checkout
# is nested inside another workspace (e.g. a git worktree under
# `.claude/worktrees`).
[workspace]

[package]
name = "codelink-bracket-judge-fixture"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
broccoli-server-sdk = { path = "../../../../server-sdk", features = ["guest"] }
extism-pdk = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
