[package]
name = "server"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
# Global allocator. glibc retains freed large (mmap'd) allocations and is slow to
# return them to the OS, which under concurrent judging of large-testcase problems
# inflates RSS well past the live working set. jemalloc returns freed memory far
# more aggressively. The `profiling` feature enables opt-in heap profiling via
# `_RJEM_MALLOC_CONF=prof:true,...` for diagnosis.
tikv-jemallocator = { version = "0.6", features = ["profiling", "unprefixed_malloc_on_supported_platforms"] }
anyhow.workspace = true
argon2.workspace = true
async-trait.workspace = true
broccoli-server-sdk.workspace = true
common = { workspace = true, features = ["sea-orm", "object-storage"] }
crossbeam.workspace = true
dashmap.workspace = true
flume.workspace = true
futures.workspace = true
mq.workspace = true
axum = { workspace = true, features = ["multipart"] }
axum-client-ip.workspace = true
chrono.workspace = true
config.workspace = true
extism.workspace = true
jsonwebtoken.workspace = true
plugin-core.workspace = true
rand.workspace = true
sea-orm = { workspace = true, features = [
  "runtime-tokio-rustls",
  "sqlx-postgres",
  "macros",
  "schema-sync",
  "entity-registry",
  "with-uuid",
] }
sea-orm-migration.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tokio-util = { version = "0.7", features = ["io"] }
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-opentelemetry.workspace = true
opentelemetry.workspace = true
opentelemetry-http.workspace = true
opentelemetry_sdk.workspace = true
opentelemetry-prometheus.workspace = true
prometheus.workspace = true
utoipa.workspace = true
utoipa-axum.workspace = true
utoipa-scalar.workspace = true
utoipa-swagger-ui.workspace = true
uuid.workspace = true
zip.workspace = true
mime_guess.workspace = true
matchit.workspace = true
flate2.workspace = true
tar.workspace = true
hex.workspace = true
sha2 = { workspace = true }
axum_typed_multipart.workspace = true
base64.workspace = true
axum-extra = { workspace = true, features = ["cookie"] }
lru = "0.16.3"
redis = { workspace = true }
reqwest = { workspace = true }
hostname = "0.4"
hyper.workspace = true
hyper-util.workspace = true
ipnet.workspace = true
tower.workspace = true
tower_governor = { version = "0.8", default-features = false, features = ["axum"] }

[features]
default = []
bundled-stress-test = []

[dev-dependencies]
reqwest = { version = "0.12", features = ["cookies", "json", "multipart"] }
sea-orm = { workspace = true, features = ["mock"] }
worker = { path = "../worker", features = ["test-support"] }
tempfile = "3"
testcontainers = "0.23"
testcontainers-modules = { version = "0.11", features = ["postgres", "redis"] }
test-support = { path = "../test-support" }

[target.'cfg(unix)'.dev-dependencies]
testcontainers = { version = "0.23", features = ["watchdog"] }
