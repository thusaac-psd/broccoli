[package]
name = "test-support"
version = "0.1.0"
edition = "2024"
publish = false
description = "Shared harness for the server's integration and e2e test trees"

[dependencies]
common = { workspace = true, features = ["test-util"] }
libc = "0.2"
reqwest = { version = "0.12", features = ["cookies", "json", "multipart"] }
sea-orm = { workspace = true }
serde_json.workspace = true
server = { path = "../server" }
testcontainers.workspace = true
testcontainers-modules = { workspace = true, features = ["postgres", "redis"] }
tokio.workspace = true
toml.workspace = true

[target.'cfg(unix)'.dependencies]
testcontainers = { workspace = true, features = ["watchdog"] }
