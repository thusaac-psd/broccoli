[package]
name = "common"
version = "0.1.0"
edition = "2024"

[features]
default = []
sea-orm = ["dep:sea-orm", "broccoli-api-types/sea-orm"]
object-storage = ["dep:reqwest", "dep:bytes", "dep:hmac", "dep:httpdate", "dep:tokio-util", "dep:futures"]
# `storage::object_storage::testing`: a SeaweedFS testcontainer for other
# crates' tests.
testing = ["object-storage", "dep:testcontainers"]
# A real Redis for tests (`common::test_util`).
test-util = ["dep:testcontainers", "dep:testcontainers-modules"]
# Clock hooks only tests call (`PlatformClock::sync`, a clock with no
# database). Never enabled by a release build.
test-hooks = ["sea-orm"]

[dependencies]
libc = "0.2"
anyhow.workspace = true
broccoli-api-types.workspace = true
broccoli-types.workspace = true
async-trait.workspace = true
chrono.workspace = true
config.workspace = true
rand.workspace = true
reqwest = { workspace = true, optional = true }
bytes = { version = "1", optional = true }
hmac = { version = "0.12", optional = true }
httpdate = { version = "1", optional = true }
sea-orm = { workspace = true, optional = true, features = ["runtime-tokio-rustls", "sqlx-postgres"] }
tokio-util = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
serde.workspace = true
serde_ignored.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-opentelemetry.workspace = true
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
opentelemetry-otlp.workspace = true
opentelemetry-prometheus.workspace = true
prometheus.workspace = true
utoipa.workspace = true
hex.workspace = true
sha2.workspace = true
uuid.workspace = true
redis.workspace = true
hostname = "0.4"
testcontainers = { workspace = true, optional = true }
testcontainers-modules = { workspace = true, features = ["redis"], optional = true }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }
testcontainers.workspace = true
testcontainers-modules = { workspace = true, features = ["redis"] }
