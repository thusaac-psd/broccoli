[package]
name = "broccoli-types"
version = "0.1.1"
edition = "2024"
description = "Shared host/guest wire and domain types for the Broccoli online judge"
license = "MIT"
repository = "https://github.com/THUSAAC-PSD/broccoli"

[features]
default = []
guest = ["dep:extism-pdk"]
utoipa = ["dep:utoipa"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
extism-pdk = { version = "1.0", optional = true }
utoipa = { version = "5", optional = true }

[dev-dependencies]
toml = "0.9"
uuid.workspace = true
