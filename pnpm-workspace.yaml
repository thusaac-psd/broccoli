packages:
  - packages/*
  - plugins/*/frontend

# One version for the toolchain and the libraries the web app shares with plugin
# frontends. Packages reference these as `catalog:`.
catalog:
  '@monaco-editor/react': ^4.7.0
  '@tailwindcss/postcss': ^4.3.5
  '@tanstack/react-query': ^5.107.1
  # @tsdown/css requires the exact tsdown version it was released with.
  '@tsdown/css': 0.21.10
  '@types/node': ^24.19.2
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  postcss: ^8.5.32
  postcss-import: ^16.2.0
  react-router: ^7.18.5
  tailwindcss: ^4.3.5
  tsdown: 0.21.10
  typescript: ~5.9.3

# Transitive versions pinned past a security advisory until the direct
# dependency that pulls them in accepts a patched release.
overrides:
  # monaco-editor 0.57 pins dompurify 3.4.15.
  dompurify: ^3.4.17
  # rehype-katex 7 requires katex ^0.16.
  katex: ^0.18.2

onlyBuiltDependencies:
  - esbuild
