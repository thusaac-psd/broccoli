packages:
  - packages/*
  - plugins/*/frontend

# One version for the toolchain and the libraries the web app shares with plugin
# frontends. Packages reference these as `catalog:`.
catalog:
  '@monaco-editor/react': ^4.7.0
  '@tailwindcss/postcss': ^4.3.5
  '@tanstack/react-query': ^5.107.1
  # @tsdown/css requires the exact tsdown version it was released with.
  '@tsdown/css': 0.21.10
  '@types/node': ^24.19.2
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  postcss: ^8.5.32
  postcss-import: ^16.2.0
  react-router: ^7.18.5
  tailwindcss: ^4.3.5
  tsdown: 0.21.10
  typescript: ~5.9.3

# Transitive versions pinned past a security advisory until the direct
# dependency that pulls them in accepts a patched release.
overrides:
  # monaco-editor 0.55.1 pins dompurify 3.2.7; dompurify's 3.x API is stable.
  dompurify: ^3.4.17
  # @typescript-eslint/typescript-estree asks for minimatch ^10, which
  # GHSA-g3hv-75wg-m249 covers; 11 keeps the `minimatch` function it calls.
  'minimatch@10': ^11.0.1

auditConfig:
  ignoreGhsas:
    # KaTeX before 0.18.2: existing prototype pollution can bypass `trust`
    # restrictions. rehype-katex 7 (the only release line) requires katex
    # ^0.16, and the web app renders math with the default `trust: false`, so
    # there is no trust restriction to bypass.
    - GHSA-238p-pmpm-9mq7
    # minimatch before 11.0.1: patterns can amplify into a denial of service.
    # @react-router/fs-routes (the web app's build-time route scan; 7.x and
    # 8.x alike) asks for minimatch ^9 and calls `makeRe`, which 11 removed,
    # so no override reaches it. It matches only the route-ignore patterns in
    # the repo's own `routes.ts`, never input from a user.
    - GHSA-g3hv-75wg-m249

onlyBuiltDependencies:
  - esbuild
