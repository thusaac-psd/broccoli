# Wall time compared with another node's wall time comes from the platform
# clock (`common::clock::PlatformClock`, or SQL `now()`); durations come from
# `Instant`. Reading this host's own wall clock lets nodes disagree. Clippy
# finds this file from every crate below it; tools that show local time on
# purpose allow the lint at their crate root.
disallowed-methods = [
  { path = "chrono::Utc::now", reason = "use the platform clock (`common::clock::PlatformClock`) or SQL `now()`" },
  { path = "chrono::Local::now", reason = "use the platform clock (`common::clock::PlatformClock`) or SQL `now()`" },
  { path = "std::time::SystemTime::now", reason = "use the platform clock for wall time or `Instant` for durations" },
]

# Every rejection a handler's extractor produces answers in the API's JSON
# error shape (`{code, message}`); axum's own extractors answer text/plain.
disallowed-types = [
  { path = "axum::extract::Query", reason = "use `crate::extractors::query::AppQuery`" },
  { path = "axum::extract::Path", reason = "use `crate::extractors::path::AppPath`" },
]
