box_root = /var/local/lib/isolate
lock_root = /run/isolate/locks
cg_root = auto:/run/isolate/cgroup
# Box ids are a host-wide namespace every worker on the host shares, and one
# test case can need a box per contestant process (a communication problem
# allows up to 64) plus a manager and a compile box, so judging must never run
# out of ids.
# Box N runs as uid and gid `first_uid + N`. isolate's default base, 60000,
# puts 10000 boxes over nobody (65534) and systemd's DynamicUser range
# (61184..65519), so the base is moved to 1900000000: uids 1900000000..
# 1900009999 sit above systemd-nspawn's container range (524288..1879048191),
# below 2^31, and clear of every account and subordinate-id range a host
# allocates by default.
# Keep this in step with Dockerfile.worker and .github/actions/setup-isolate.
first_uid = 1900000000
first_gid = 1900000000
num_boxes = 10000
