[workspace]
members = [
  "packages/cli-core",
  "packages/common",
  "packages/mq",
  "packages/plugin-core",
  "packages/server",
  "packages/test-support",
  "packages/worker",
  "packages/dev-cli",
  "packages/stress-test",
  "packages/broccoli-compare",
  "packages/contestant-cli",
]
# All members EXCEPT packages/stress-test (test harness) and
# packages/broccoli-compare (comparator binary), both opt-in via
# `cargo build -p <name>` so day-to-day builds stay fast.
default-members = [
  "packages/cli-core",
  "packages/common",
  "packages/mq",
  "packages/plugin-core",
  "packages/server",
  "packages/worker",
  "packages/dev-cli",
  "packages/contestant-cli",
]
exclude = [
  "examples",
  "plugins",
]
resolver = "3"

# Size optimized profile for the broccoli binary.
[profile.release-cli]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1

[workspace.dependencies]
anyhow = "1.0.100"
argon2 = "0.5.3"
async-trait = "0.1.89"
axum = "0.8.8"
axum-client-ip = "1.3"
axum-extra = { version = "0.12.5", features = ["cookie"] }
axum_typed_multipart = "0.16.5"
base64 = "0.22"
chrono = { version = "0.4.43", features = ["serde"] }
common = { path = "packages/common" }
config = "0.15.19"
extism = "1.13.0"
futures = "0.3"
hex = "0.4"
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = [
  "server-auto",
  "service",
  "tokio",
] }
ipnet = "2"
jsonwebtoken = { version = "10.3.0", features = ["aws_lc_rs"] }
matchit = "0.9.1"
mime_guess = "2.0.5"
mq = { path = "packages/mq" }
parking_lot = "0.12.5"
plugin-core = { path = "packages/plugin-core" }
rand = "0.9"
serde = { version = "1.0.228", features = ["derive"] }
sea-orm = "2.0.4"
sea-orm-migration = { version = "2.0.4", default-features = false, features = [
  "runtime-tokio-rustls",
  "sqlx-postgres",
] }
sha2 = "0.10"
serde_json = "1.0.149"
time = "0.3.34"
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = [
  "compression-gzip",
  "cors",
  "fs",
  "set-header",
  "timeout",
  "trace",
] }
toml = "0.9.11"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "json"] }
opentelemetry = "0.31"
opentelemetry_sdk = { version = "0.31", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.31", features = ["grpc-tonic"] }
opentelemetry-http = "0.31"
tracing-opentelemetry = "0.32"
opentelemetry-prometheus = "0.31"
prometheus = "0.14"
uuid = { version = "1", features = ["v4", "v7"] }
utoipa = { version = "6", features = ["chrono"] }
utoipa-axum = "0.3"
utoipa-scalar = { version = "0.4", features = ["axum"] }
utoipa-swagger-ui = { version = "10", features = ["axum"] }
rust-s3 = { version = "0.38", default-features = false, features = [
  "tokio-rustls-tls",
] }
tokio-util = { version = "0.7", features = ["io"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
broccoli-server-sdk = { path = "packages/server-sdk" }
broccoli-types = { path = "packages/broccoli-types" }
crossbeam = "0.8"
dashmap = "6.1"
flate2 = "1"
flume = "0.11"
tar = "0.4"
dirs = "6"
open = "5"
notify = "7"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "multipart"] }
clap = { version = "4", features = ["derive"] }
# unstable-rendered-line-info enables Paragraph::line_count for scroll clamping.
ratatui = { version = "0.28", features = ["unstable-rendered-line-info"] }
crossterm = "0.28"
hdrhistogram = "7"
wiremock = "0.6"
testcontainers = "0.27"
testcontainers-modules = "0.15"
redis = { version = "1.0", features = ["tokio-comp"] }

# Keep line tables in release builds so perf-based flame graphs resolve symbols.
# Cost: ~20% binary size, no runtime impact. Drop for size-sensitive production builds.
[profile.release]
debug = "line-tables-only"
strip = "none"

# Opt-in profile for profiling runs that need actionable DWARF stacks.
# Normal release builds stay on `profile.release`; use `just build-profiling`
# or Docker build args to select this profile and frame pointers explicitly.
[profile.profiling]
inherits = "release"
debug = "full"
strip = "none"
