# Local development infrastructure. `docker compose up -d` needs no setup: the
# credentials default to the ones config/config.example.toml uses. Set
# POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB, BROCCOLI_DB_USER,
# BROCCOLI_DB_PASSWORD or REDIS_PASSWORD to change them. The server logs in as
# BROCCOLI_DB_USER, a non-superuser that owns the database and holds
# CREATEROLE; the superuser only initializes it.
services:
  db:
    image: postgres:17-alpine
    # Room for a few local servers and workers at their full pools.
    command: ['postgres', '-c', 'max_connections=200']
    ports:
      - '127.0.0.1:5433:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-broccoli_pg_secret}
      POSTGRES_DB: ${POSTGRES_DB:-broccoli}
      BROCCOLI_DB_USER: ${BROCCOLI_DB_USER:-broccoli}
      BROCCOLI_DB_PASSWORD: ${BROCCOLI_DB_PASSWORD:-broccoli_app_secret}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./config/postgres-init/20-broccoli-app-role.sh:/docker-entrypoint-initdb.d/20-broccoli-app-role.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-broccoli}']
      interval: 5s
      timeout: 5s

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD:-broccoli_redis_secret}']
    ports:
      # Bind to loopback (like postgres above): Docker's own iptables rules bypass
      # host firewalls, so a bare `6379:6379` would expose redis to the whole LAN.
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-broccoli_redis_secret}', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  # worker:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile.worker
  #   privileged: true
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #   environment:
  #     BROCCOLI__DATABASE__URL: "postgres://postgres:password@db:5432/broccoli"
  #     BROCCOLI__MQ__URL: "redis://:broccoli_redis_secret@redis:6379"
  #     BROCCOLI__MQ__ENABLED: "true"
  #     BROCCOLI__WORKER__SANDBOX_BACKEND: "isolate"
  #     BROCCOLI__WORKER__ISOLATE_BIN: "isolate"
  #     BROCCOLI__WORKER__ENABLE_CGROUPS: "true"
  #     BROCCOLI__STORAGE__DATA_DIR: "/data"
  #     RUST_LOG: "info"
  #   volumes:
  #     - worker_data:/data

  seaweedfs:
    image: chrislusf/seaweedfs:4.15
    command:
      [
        'server',
        '-dir=/data',
        '-s3',
        '-s3.config=/etc/seaweedfs/s3.json',
        '-ip=seaweedfs',
        '-metricsPort=9327',
      ]
    ports:
      # Loopback-bind (like postgres): the SeaweedFS S3 API on :8333 uses the
      # committed dev admin keys (config/seaweedfs-s3.json), so a bare 0.0.0.0
      # binding would give the whole LAN full read/write to the object store.
      - '127.0.0.1:9333:9333'
      - '127.0.0.1:8333:8333'
    volumes:
      - seaweed_data:/data
      - ./config/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro

volumes:
  pg_data:
  redis_data:
  # worker_data:
  seaweed_data:
