# Keep evaluate/operation batch state long enough for large queued judging jobs.
batch_max_age_secs = 7200

[server]
host = "127.0.0.1"
port = 3000
# Stable per-replica identity. Suffixes the operation-result queue so each
# server behind a load balancer receives its own dispatch results. Empty
# derives a unique ID for this host (from the machine ID; inside a container,
# the hostname). The ID is claimed in Redis at boot, so a second live replica
# with the same ID refuses to start instead of stealing results.
id = ""

# Floor for how many submissions this server judges at once (claimed and not
# finished). The cap in force is the larger of this and 8 x the live worker
# slots from heartbeats, so it grows with the cluster and never throttles below
# worker capacity; you do not need to tune it when adding workers. Past the
# cap, a burst waits as `Queued` in the database, claimable by any server.
# Measured: 1000 submissions / 100 concurrent went from 979 in flight on one
# server to 256, same throughput, ~13% less peak memory. 0 = no cap.
max_in_flight_submissions = 256

# Backpressure on POST: cap on durable `Queued` rows across
# `submission`, `code_run`, and `submission_judgement` combined. When
# the live depth is at or above this value, POST endpoints that would
# insert a new `Queued` row return 503 + Retry-After (code
# `QUEUE_OVERLOADED`) instead of accepting more work. Set to 0 to
# disable. Default 5000. Not the same as `dispatcher_admission_queue_max`
# below, which bounds in-process dispatch tasks rather than database rows.
max_queued_submissions = 5000
# Per-server cap on in-process dispatch tasks waiting on the
# dispatcher semaphore. Bounds spawn bursts when the steal-scanner
# picks up many orphaned rows at once. Default 100.
dispatcher_admission_queue_max = 100

[server.cors]
allow_origins = ["http://localhost:5173", "http://127.0.0.1:5173"]
max_age = 3600

[worker]
# Empty derives a unique ID for this host (from the machine ID; inside a
# container, the hostname). Two live workers with the same ID refuse to start.
id = ""
sandbox_backend = "isolate"
isolate_bin = "isolate"
enable_cgroups = true
max_concurrency = 1
fairness_unsafe_allow = false

[database]
url = "postgres://postgres:broccoli_pg_secret@localhost:5433/broccoli"

[mq]
enabled = true
url = "redis://:broccoli_redis_secret@localhost:6379"
# Prefix of every message queue stream key (see the "Message queue" internals
# page of the docs site).
operation_queue_name = "operation_tasks"

[mq.dlq]
max_retries = 3
base_delay_ms = 1000
max_delay_ms = 60000
stuck_job_timeout_secs = 7200
stuck_job_scan_interval_secs = 60
retry_cleanup_interval_secs = 300
retry_max_age_secs = 7200

[auth]
jwt_secret = "generate-a-long-random-string-here"
# Set to false when serving over plain HTTP (browsers drop Secure cookies on HTTP).
secure_cookies = true

[bootstrap]
# Optional first-run admin bootstrap. Leave both empty for normal development.
# A boot creates or resets this account (and restores the admin role) only
# when no active user holds system:admin, or when reset_admin is true;
# otherwise it is left alone.
admin_username = ""
admin_password = ""
reset_admin = false

[submission]
max_size = 1048576
# Release bundles override this to a higher value for contest/stress-test
# readiness. Keep development conservative by default.
rate_limit_per_minute = 10

[storage]
backend = "database"  # Options: "filesystem", "database", "object_storage"
data_dir = "./data"
max_blob_size = 2147483648 # 2GB

# S3-compatible storage settings (used when storage.backend = "object_storage")
[storage.object_storage]
bucket = "broccoli-blobs"
region = "us-east-1"
endpoint = "http://127.0.0.1:8333"
access_key = "broccoli_s3_access"
secret_key = "broccoli_s3_secret"
path_style = true
temp_dir = ""

[plugin]
plugins_dir = "./plugins"
enable_wasi = true
# Guests running at once; default two per core.
# max_concurrent_calls = 8
# Resident memory above which idle plugin instances are dropped, in bytes or
# a size such as "4GiB"; default 3/4 of the cgroup memory limit, or 1/4 of
# the machine's memory without one.
# memory_budget = "4GiB"
# How long a judging, operation or timer call may run, in seconds.
# call_timeout_secs = 300

[observability]
log_format = "pretty"       # "pretty" for dev, "json" for production
log_filter = "info"          # tracing_subscriber::EnvFilter syntax (e.g. "info,server=debug,hyper=warn")

[observability.otlp]
endpoint = ""               # OTLP gRPC endpoint, e.g. "http://localhost:4317" — empty = disabled
service_name = "broccoli-server"  # "broccoli-worker" for workers
