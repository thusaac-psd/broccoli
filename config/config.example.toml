# Local development settings for the server and the worker. Copy this file to
# config/config.toml. It holds only what a node cannot derive: where the
# database, Redis and object storage are, and the secrets. Everything else has
# a default; release/docs/configuration-reference.md lists the advanced
# overrides. The URLs and keys match `docker compose up -d` at the repo root.

[database]
url = "postgres://broccoli:broccoli_app_secret@localhost:5433/broccoli"

[mq]
url = "redis://:broccoli_redis_secret@localhost:6379"

[auth]
jwt_secret = "generate-a-long-random-string-here"

[bootstrap]
# Optional first-run admin. Leave empty for normal development.
admin_username = ""
admin_password = ""

[server.cors]
# The Vite dev server's origins.
allow_origins = ["http://localhost:5173", "http://127.0.0.1:5173"]

[storage]
backend = "database"  # "filesystem", "database" or "object_storage"

# Used when storage.backend = "object_storage".
[storage.object_storage]
bucket = "broccoli-blobs"
endpoint = "http://127.0.0.1:8333"
access_key = "broccoli_s3_access"
secret_key = "broccoli_s3_secret"
path_style = true

[plugin]
plugins_dir = "./plugins"
