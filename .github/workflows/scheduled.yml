name: Security Audit

on:
  schedule:
    - cron: "0 0 * * 1" # Every Monday 00:00 UTC (08:00 UTC+8)
  workflow_dispatch:
  # A pull request that changes what gets installed is audited before it lands,
  # not on the following Monday.
  pull_request:
    paths:
      - "**/Cargo.lock"
      - "**/Cargo.toml"
      - "**/package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "website/pnpm-lock.yaml"
      - ".cargo/audit.toml"
      - "scripts/audit-rust.sh"
      - ".github/workflows/scheduled.yml"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-audit
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-audit

      # Every committed Cargo.lock: the workspace, each plugin, the server test
      # fixtures and the examples. Ignores live in .cargo/audit.toml, each with
      # its reason.
      - name: cargo audit
        run: ./scripts/audit-rust.sh

  js:
    name: JS advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json

      # `pnpm audit` reads the lockfile, so nothing needs installing. `--prod`
      # skips devDependencies: they never ship.
      - name: pnpm audit (workspace)
        run: pnpm audit --prod

      # The docs site keeps its own lockfile; its ignores are documented in
      # website/README.md.
      - name: pnpm audit (website)
        working-directory: website
        run: pnpm audit --prod --ignore-workspace

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy secret scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          exit-code: "1"
          format: table
