name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  RUST_BACKTRACE: short

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Installs the toolchain rust-toolchain.toml pins, with its components
      # and targets. Every cargo command in the repository, plugin builds
      # included, resolves to it.
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Check formatting
        run: cargo fmt --all --check

      # `plugins` is excluded from the root workspace (wasm32 targets, own
      # `[workspace]` pins), so `cargo fmt --all --check` above never looks at
      # plugin crates. This iterates over them separately; see the script for
      # why a script beats a hardcoded crate list here.
      - name: Check plugin formatting
        run: ./scripts/fmt-plugins.sh

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Same exclusion problem as formatting: `cargo clippy --workspace`
      # above never looks at plugin crates, so their lint findings never ran
      # in CI. See the script for why a script beats a hardcoded crate list
      # here.
      - name: Clippy plugins
        run: ./scripts/clippy-plugins.sh

      # `broccoli-server-sdk`'s `guest` feature (the WASM guest-side surface
      # every plugin crate depends on, gating e.g. the `extism-pdk` calls and
      # `#[cfg(target_arch = "wasm32")]` code in `sdk/eval.rs`) is off by
      # default, so neither the workspace Clippy step above (packages/server
      # depends on this crate with default features only) nor Clippy plugins
      # above (that script only lints each plugin's own crate, not its path
      # dependencies) ever lints server-sdk with it enabled. See the script
      # for why this is a single fixed invocation rather than a discovery
      # loop like the plugin scripts above.
      - name: Clippy server-sdk (guest feature)
        run: ./scripts/clippy-server-sdk-guest.sh

      - name: Build plugin WASM artefacts
        run: ./scripts/build-plugins.sh

      - name: Test
        timeout-minutes: 45
        env:
          E2E_SANDBOX_BACKEND: mock
        run: cargo test --workspace --locked -- --test-threads=4

      # Same exclusion problem as formatting: `cargo test --workspace` never
      # touches plugin crates, so their tests (including the ICPC
      # submission-freeze mask and IOI feedback mask tests) never ran in CI.
      - name: Test plugins
        run: ./scripts/test-plugins.sh

      - name: Documentation
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: "-D warnings"

      # `plugins` is excluded from the root workspace, so the step above never
      # documents a plugin crate -- the same gap already closed for fmt,
      # clippy and tests. A broken intra-doc link in a plugin went undetected
      # by every other gate until this one existed. See the script for why it
      # discovers crates rather than listing them.
      - name: Documentation (plugins)
        run: ./scripts/doc-plugins.sh

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `@broccoli/web` type-checks against the shared SDK's generated `dist`
      # (subpath `.d.ts`), which is git-ignored. Build it before lint/typecheck;
      # the later `pnpm build` step rebuilds it idempotently via `pnpm -r`.
      - name: Build web SDK
        run: pnpm --filter @broccoli/web-sdk build

      - name: Lint
        run: pnpm lint

      # Runs every workspace package's `typecheck` script: the web app and
      # each plugin frontend (`pnpm build` transpiles without type checking).
      - name: Type check
        run: pnpm typecheck

      - name: Check formatting
        run: pnpm format:check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # The server caches `/assets/*` as `immutable`, so a file name that
      # ships new bytes would stay stale in browsers for a year. This rebuilds
      # the web app after edits that reach it through the shared-deps shims
      # and fails if any content-hashed name kept its name with new bytes.
      - name: Check asset hashes
        run: pnpm --filter @broccoli/web check:asset-hashes

  release-bundled-feature:
    name: Release / bundled-stress-test feature
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Installs the toolchain rust-toolchain.toml pins, with its components
      # and targets. Every cargo command in the repository, plugin builds
      # included, resolves to it.
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-bundled-feature

      - name: Stage fixture binaries as embedded
        run: |
          mkdir -p packages/server/embedded/stress-test
          cp packages/server/tests/fixtures/embedded-stress-test/* \
             packages/server/embedded/stress-test/

      - name: Build (bundled feature)
        run: cargo build -p server --features bundled-stress-test --locked

      # The vanilla `Rust` job already runs the full server test suite. Here we
      # only re-run the tests that exercise the cfg-gated `/downloads` routes.
      - name: Test downloads endpoint
        run: cargo test -p server --features bundled-stress-test --locked --test integration -- downloads

  release-scripts:
    name: Release / installer scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # caddy validate and the airgap TLS loop skip without a local Caddy image.
      - name: Pull the gateway images
        run: docker pull caddy:2-alpine && docker pull caddy:2

      - name: Run every release shell suite
        run: |
          status=0
          for t in release/test/*.sh release/*/test/*.sh; do
            echo "::group::$t"
            if bash "$t"; then
              echo "ok: $t"
            else
              echo "::error file=$t::$t failed"
              status=1
            fi
            echo "::endgroup::"
          done
          exit "$status"
