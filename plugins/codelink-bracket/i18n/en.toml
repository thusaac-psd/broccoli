# codelink-bracket
'codelink-bracket.title' = 'Afternoon bracket'

'codelink-bracket.rules.title' = 'Afternoon knockout round'
'codelink-bracket.rules.description' = "Single elimination. Before each match, both players rank the other player's three problems. The match is three games. In each game, each player works on the next problem in the order their opponent chose, and the first accepted submission wins the game. If neither player solves their problem before the deadline, nobody scores. After three games, the player with more wins advances. A level score goes to tiebreak problems."
'codelink-bracket.rules.order' = 'Game winners follow the submission time of accepted solutions. Submission ID breaks exact time ties. If a submission is still being judged at the deadline, the game waits for its result. Staff decide the match if judging does not finish in time.'

