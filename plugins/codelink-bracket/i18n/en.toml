'codelink-bracket.rules.schedule' = 'Scheduled stages start ordering together for a full 3 minutes. The last ranking is used; missing rankings use the listed order. Preparation then lasts 30 seconds by default. Each continuing game follows a configurable break, normally 60 seconds from settlement. The next stage uses its own scheduled time. Semifinal losers play for third place when enabled.'

'codelink-bracket.rules.title' = 'Afternoon knockout round'
'codelink-bracket.rules.description' = "Single elimination. Before each match, players rank the opponent's problems. Each stage sets a regular game cap (BO) and a win target (FT). Reaching FT ends the match immediately. Otherwise, after BO games, the higher score advances and a level score goes to a shared tiebreak. A game nobody solves awards no win."
'codelink-bracket.rules.order' = "Regular games compare actual submission time plus accumulated score penalties, with submission ID breaking exact ties. WA, TLE, MLE, and RE add the configured penalty to subsequent submissions in the same regular game; the count resets each game. Tiebreaks compare actual submission times without error penalties. Penalties do not shorten the submission window or consume shared extra time. Wait for your previous result before submitting again. Correct results wait for submissions that could beat their score to finish judging. Staff decide the match if judging cannot finish in time."

