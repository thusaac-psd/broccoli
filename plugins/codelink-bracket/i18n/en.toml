# codelink-bracket
'codelink-bracket.title' = 'Afternoon bracket'

'codelink-bracket.rules.title' = 'Afternoon knockout round'
'codelink-bracket.rules.description' = "Single elimination. Before each match, both players rank the other player's problems. Each stage sets its number of regular games; all of them are played. In each game, each player works on the next problem in the order their opponent chose, and the first accepted submission wins the game. If neither player solves their problem before the deadline, nobody scores. After the regular games, the player with more wins advances. A level score goes to tiebreak problems."
'codelink-bracket.rules.order' = 'Games compare actual submission time plus accumulated score penalties, with submission ID breaking exact ties. WA, TLE, MLE, and RE add the configured penalty to subsequent submissions in the same game; the count resets each game. Penalties do not shorten the submission window or consume shared extra time. Wait for your previous result before submitting again. Correct results wait for submissions that could beat their score to finish judging. Staff decide the match if judging cannot finish in time.'

