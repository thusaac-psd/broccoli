# codelink-bracket
'codelink-bracket.title' = '下午场对阵'

'codelink-bracket.rules.title' = '下午场淘汰赛'
'codelink-bracket.rules.description' = '单败淘汰。每场比赛开始前，双方各自为对手的 3 道题排定顺序。每场比赛共 3 个小局，每个小局中双方各做对手为自己排定的下一道题，先提交通过者赢得该小局；截止时双方都未通过则该小局无人得分。3 个小局后胜局多者晋级，比分相同则进入附加赛。'
'codelink-bracket.rules.order' = '小局胜负按通过提交的提交时间判定，时间完全相同时按提交 ID 排序。截止时如有提交仍在评测，该小局会等待评测结果；评测未能及时完成时，由工作人员裁定本场比赛。'

