# codelink-bracket
'codelink-bracket.title' = '下午场对阵'

'codelink-bracket.rules.title' = '下午场淘汰赛'
'codelink-bracket.rules.description' = "单败淘汰。每场比赛开始前，双方各自为对手的题目排定顺序。每阶段分别设置常规小局上限 BO 和晋级所需胜局数 FT，先达到 FT 的选手立即获胜。打满 BO 局后胜局多者晋级，比分相同则进入双方同题的附加赛。小局截止时双方均未通过则无人得分。"
'codelink-bracket.rules.order' = "常规小局胜负比较实际提交用时加累计计分罚时，完全相同时按提交 ID 排序。WA、TLE、MLE、RE 每次为本常规小局后续提交增加设置中的罚时，进入下一小局清零。附加赛按实际提交时间比较，错误提交不罚时。罚时不缩短提交窗口，也不消耗共享加时。上一发结果返回前不能再次提交；正确提交需等待可能反超其成绩的提交完成评测。评测未能及时完成时，由工作人员裁定本场比赛。"

