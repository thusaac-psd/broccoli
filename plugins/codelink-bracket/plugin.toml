name = "codelink-bracket"
version = "0.1.0"
description = "Codelink afternoon knockout: single elimination with opponent-ordered problem sets"

[translations]
en = "i18n/en.toml"
zh-CN = "i18n/zh-CN.toml"

[server]
entry = "codelink_bracket.wasm"
permissions = [
    "logger",
    "plugin:register",
    "storage",
    "sql",
    "submission",
    "evaluator:evaluate",
    "config:read",
    "timer",
]

[[server.queries]]
topic = "visibility"
function = "decide_visibility"

[[server.hooks]]
topic = "before_submission"
function = "check_submission"
scope = "global"

[[server.timers]]
function = "on_timer"

[[server.routes]]
method = "POST"
path = "/api/plugins/codelink-bracket/contests/{contest_id}/setup"
handler = "api_setup"

[[server.routes]]
method = "POST"
path = "/api/plugins/codelink-bracket/contests/{contest_id}/matches/{match_id}/order"
handler = "api_order"

[[server.routes]]
method = "POST"
path = "/api/plugins/codelink-bracket/contests/{contest_id}/matches/{match_id}/start"
handler = "api_start"

[[server.routes]]
method = "POST"
path = "/api/plugins/codelink-bracket/contests/{contest_id}/matches/{match_id}/force-decide"
handler = "api_force_decide"

[[server.routes]]
method = "GET"
path = "/api/plugins/codelink-bracket/contests/{contest_id}/bracket"
handler = "api_get_bracket"

[[server.routes]]
method = "GET"
path = "/api/plugins/codelink-bracket/contests/{contest_id}/matches/{match_id}"
handler = "api_get_match"

[web]
root = "frontend/dist"
entry = "index.js"
css = ["styles.css"]

[web.components]
BracketScoreboard = "BracketScoreboard"
BracketLiveXiaoju = "BracketLiveXiaoju"
BracketContestInfo = "BracketContestInfo"
BracketNotifications = "BracketNotifications"
BracketPresentation = "BracketPresentation"
BracketManageAction = "BracketManageAction"
BracketManagementPage = "BracketManagementPage"

[[web.routes]]
path = "/contests/:contestId/bracket-management"
component = "BracketManagementPage"

[[web.slots]]
name = "contest.admin.actions"
position = "append"
component = "BracketManageAction"
permission = "contest:manage"
contest_type = "codelink-bracket"

[[web.slots]]
name = "contest.admin.menu"
position = "append"
component = "BracketManageAction"
permission = "contest:manage"
contest_type = "codelink-bracket"

[[web.slots]]
name = "contest.layout"
position = "prepend"
component = "BracketPresentation"
contest_type = "codelink-bracket"

[[web.slots]]
name = "contest.layout"
position = "prepend"
component = "BracketNotifications"
contest_type = "codelink-bracket"

[[web.slots]]
name = "ranking.content"
position = "wrap"
component = "BracketScoreboard"
contest_type = "codelink-bracket"

[[web.slots]]
name = "problem-detail.sidebar"
position = "prepend"
component = "BracketLiveXiaoju"
contest_type = "codelink-bracket"

[[web.slots]]
name = "contest-overview.content"
position = "prepend"
component = "BracketContestInfo"
contest_type = "codelink-bracket"

[bundle]
# Event-specific format: shipped with releases but loaded only once enabled.
mode = "optional"

[[server.routes]]
method = "GET"
path = "/api/plugins/codelink-bracket/contests/{contest_id}/setup"
handler = "api_get_setup"
