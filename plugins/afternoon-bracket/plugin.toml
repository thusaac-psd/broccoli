name = "afternoon-bracket"
version = "0.1.0"
description = "16-player single-elimination bracket with per-小局 asymmetric problem sets"

[translations]
en = "i18n/en.toml"

[server]
entry = "afternoon_bracket.wasm"
permissions = [
    "logger",
    "plugin:register",
    "storage",
    "sql",
    "submission",
    "evaluator:evaluate",
    "config:read",
    "timer",
]

[[server.queries]]
topic = "visibility"
function = "decide_visibility"

[[server.hooks]]
topic = "before_submission"
function = "check_submission"
scope = "resource"

[[server.timers]]
function = "on_timer"

[[server.routes]]
method = "POST"
path = "/api/plugins/afternoon-bracket/contests/{contest_id}/setup"
handler = "api_setup"

[[server.routes]]
method = "POST"
path = "/api/plugins/afternoon-bracket/contests/{contest_id}/matches/{match_id}/order"
handler = "api_order"

[[server.routes]]
method = "POST"
path = "/api/plugins/afternoon-bracket/contests/{contest_id}/matches/{match_id}/start"
handler = "api_start"

[[server.routes]]
method = "POST"
path = "/api/plugins/afternoon-bracket/contests/{contest_id}/matches/{match_id}/force-decide"
handler = "api_force_decide"

[[server.routes]]
method = "GET"
path = "/api/plugins/afternoon-bracket/contests/{contest_id}/bracket"
handler = "api_get_bracket"

[[server.routes]]
method = "GET"
path = "/api/plugins/afternoon-bracket/contests/{contest_id}/matches/{match_id}"
handler = "api_get_match"
