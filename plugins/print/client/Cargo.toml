# The native print client is a standalone binary, built and released on its own
# (see release.yml's build-print-client job) rather than with the WASM plugin.
# An explicit empty `[workspace]` pins it as its own workspace root: without it,
# `plugins/print/Cargo.toml`'s `[workspace]` table claims this crate as a member
# and cargo refuses to build it. (`[package] exclude` there is the packaging
# exclude, which has no bearing on workspace membership.)
[workspace]

[package]
name = "broccoli-print-client"
version = "0.1.0"
edition = "2021"
description = "Cross-platform print station client for the broccoli print plugin"
license = "MIT"

[[bin]]
name = "print-client"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
dialoguer = "0.11"
printpdf = "0.7.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
toml = "0.8"
unicode-width = "0.2"
ureq = { version = "2", features = ["json"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
