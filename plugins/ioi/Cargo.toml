# Root plugin crate: intentionally outside the Cargo workspace (see top-level
# Cargo.toml `exclude`). An explicit empty `[workspace]` pins this crate as its
# own workspace root so cargo resolves it standalone even when the checkout is
# nested inside another workspace (e.g. a git worktree under `.claude/worktrees`).
[workspace]

[package]
name = "ioi-plugin"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
broccoli-server-sdk = { path = "../../packages/server-sdk", features = ["guest"] }
extism-pdk = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
